[package]
name = "cairn"
version = "0.0.0"
description = "The Cairn core executable: the hook handlers, the MCP server and the CLI so far"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
serde_json.workspace = true
testkit.workspace = true

[lints]
workspace = true

# ENG-02: the one thing this crate does, and the workspace crates it may
# depend on (a product crate never depends on tooling, tests aside). The
# architecture check reads both.
[package.metadata.cairn]
responsibility = "Runs the core executable: the hook handlers, the MCP server and the CLI"
may-depend-on = []
may-dev-depend-on = ["testkit"]
