# Every build of the workspace, local, CI and release alike, compiles
# SQLite without the code that loads extensions (ADR-2610110553): no
# `dlopen` links into the core, so it can load no foreign native code.
[env]
# Forced, so a LIBSQLITE3_FLAGS a builder's environment sets cannot
# turn extension loading back on; the store's tests prove it is gone.
LIBSQLITE3_FLAGS = { value = "-USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION", force = true }
