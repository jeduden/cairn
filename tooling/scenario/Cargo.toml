[package]
name = "scenario"
version = "0.0.0"
description = "Reads features/ into scenarios, keeps them in step with the SRS, and runs them"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cucumber.workspace = true
srs.workspace = true

[dev-dependencies]
adr.workspace = true
drift.workspace = true
engineering.workspace = true
testkit.workspace = true

# The executable requirement matrix: every scenario under features/,
# run through cucumber-rs. It has its own main, so it is no libtest
# harness.
[[test]]
name = "bdd"
path = "tests/bdd/main.rs"
harness = false

[lints]
workspace = true
