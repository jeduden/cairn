name: Set up pinned tools
description: Install selected tools from mise.toml and mise.lock
inputs:
  tools:
    description: Space-separated mise tool names to install
    required: true
  cache:
    description: Whether CI may restore and save tool caches
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # mise.sha256 beside this file is the single mise pin: one
    # sha256sum line per platform's uncompressed release binary, named
    # mise-vVERSION-PLATFORM. scripts/setup-web.sh reads it too. Bump the
    # version and every platform checksum together.
    - name: Select the pinned mise binary
      id: mise
      shell: bash
      run: |
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) platform=linux-x64 ;;
          Linux/ARM64) platform=linux-arm64 ;;
          macOS/X64) platform=macos-x64 ;;
          macOS/ARM64) platform=macos-arm64 ;;
          *) echo "::error::Unsupported mise platform: $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        read -r sha256 file < <(grep -E "  mise-v[0-9.]+-$platform\$" "$GITHUB_ACTION_PATH/mise.sha256")
        version=${file#mise-v}
        version=${version%-"$platform"}
        test -n "$sha256" && test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
    # mise stores Rustup's proxy in its data directory, but Rustup's
    # actual toolchain lives elsewhere. Cache only this project's exact
    # toolchain, not every compiler on the runner image.
    - name: Locate the pinned Rust toolchain
      id: rust
      if: inputs.cache == 'true' && startsWith(inputs.tools, 'rust')
      shell: bash
      run: |
        version="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
        host="$(cd "$RUNNER_TEMP" && rustc -vV | sed -n 's/^host: //p')"
        test -n "$version" && test -n "$host"
        echo "path=$HOME/.rustup/toolchains/$version-$host" >> "$GITHUB_OUTPUT"
    - name: Cache the pinned Rust toolchain
      if: inputs.cache == 'true' && startsWith(inputs.tools, 'rust')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.rust.outputs.path }}
        key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
    - name: Install selected pinned tools
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        version: ${{ steps.mise.outputs.version }}
        sha256: ${{ steps.mise.outputs.sha256 }}
        install_args: --locked ${{ inputs.tools }}
        cache: ${{ inputs.cache }}
        add_shims_to_path: false
