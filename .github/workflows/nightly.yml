name: Nightly

# The long-running gates that do not fit a pull request's budget:
# coverage-guided fuzzing (ENG-07), the crash-consistency harness
# (ENG-06), the concurrency soak (ENG-09) and the live Claude Code run
# (ENG-17), each as its plan lands.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ENG-07: cargo-fuzz runs every target under fuzz/, on the exact
      # dated nightly ENG-01 pins for it. Neither exists yet; the plan
      # that adds the first fuzz target pins the nightly and puts the
      # run here, and until then this step fails rather than skip a
      # target it cannot run.
      - name: Fuzz every target
        shell: bash
        run: |
          if [ ! -f fuzz/Cargo.toml ]; then
            echo "no fuzz targets yet" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::fuzz/ has targets, but this job does not run cargo-fuzz yet"
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashers
          path: fuzz/artifacts/
