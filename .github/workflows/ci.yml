name: CI

# The same gate the repository runs locally, run again where it cannot
# be skipped. Nothing here is new policy: CLAUDE.md's build commands
# are the source, and a job that drifts from them is the bug.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review too: the review workflow skips drafts and runs
    # after CI, so marking a pull request ready must rerun CI.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run moot; a
# push to main always finishes, so every main commit has a verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The repository tooling is Rust (plan 2610050706). Every Rust job
  # installs the release rust-toolchain.toml names (ENG-01), reading it
  # from there, so no job names another.
  #
  # Every unit and integration test, and every scenario through
  # cucumber-rs. Pending scenarios are skipped and counted, so the
  # backlog is visible in every run.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job here pushes, and a checkout that leaves a token in
          # .git/config hands one to every later step.
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install
          "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          --profile minimal --component clippy,rustfmt,llvm-tools-preview
          --no-self-update
      - run: cargo test --workspace --locked
      # The pending backlog, counted. A measurement, not a gate.
      - name: Count scenarios
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test --locked --quiet -p scenario --test bdd |
            grep '^scenarios:' | tee -a "$GITHUB_STEP_SUMMARY"

  # ENG-11: line coverage per test layer (unit, integration,
  # end-to-end) and per crate, held to the floors in Cargo.toml's
  # [workspace.metadata.coverage]. The table lands in the job summary,
  # and Codecov receives one flag per test layer.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token Codecov exchanges for an upload grant, below.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install
          "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          --profile minimal --component clippy,rustfmt,llvm-tools-preview
          --no-self-update
      # An exact version from crates.io, built against its own
      # lockfile. Bump it by hand, the way the zizmor version is.
      - run: cargo install --locked cargo-llvm-cov@0.9.1
      - run: cargo run --locked -p coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: target/coverage/
      # OIDC over a stored token: the runner mints a short-lived
      # identity that Codecov exchanges for an upload grant, so no
      # secret sits in this repository's settings. A fork PR has no
      # id-token, so the steps are skipped rather than failing.
      - name: Upload unit coverage to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage/unit.lcov
          flags: unit
          # Only the named file: the uploader's search would sweep up
          # the other test layers' lcov beside it under this flag.
          disable_search: true
          fail_ci_if_error: false
      - name: Upload integration coverage to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage/integration.lcov
          flags: integration
          # Only the named file: the uploader's search would sweep up
          # the other test layers' lcov beside it under this flag.
          disable_search: true
          fail_ci_if_error: false
      - name: Upload end-to-end coverage to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage/e2e.lcov
          flags: e2e
          # Only the named file: the uploader's search would sweep up
          # the other test layers' lcov beside it under this flag.
          disable_search: true
          fail_ci_if_error: false

  # ENG-16: clippy with warnings denied, and rustfmt's layout.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install
          "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          --profile minimal --component clippy,rustfmt,llvm-tools-preview
          --no-self-update
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ENG-16: cargo-deny holds every crate in the tree to ENG-18's
  # license allow-list (deny.toml names the exceptions), to crates.io
  # and to no wildcard; cargo-audit refuses a crate with a known
  # vulnerability.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install
          "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          --profile minimal --component clippy,rustfmt,llvm-tools-preview
          --no-self-update
      # Exact versions from crates.io, built against their own
      # lockfiles. Bump them by hand, the way the zizmor version is.
      - run: cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2
      - run: cargo deny check licenses bans sources
      - run: cargo audit

  # ENG-27: every check that keeps the specification, its scenarios
  # and the repository's records in step is proven here. The suite
  # injects each registered drift into a copy of the checkout and fails
  # when the check it names lets the drift through. It needs mdsmith on
  # PATH, so it runs here rather than in `cargo test --workspace`.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: >-
          rustup toolchain install
          "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          --profile minimal --component clippy,rustfmt,llvm-tools-preview
          --no-self-update
      # The same pinned mdsmith the markdown job lints with, installed
      # onto PATH without running it. Bump the SHA and `version` together.
      - uses: jeduden/mdsmith@0ca0d2f7c95ab53e3e9ed8851150af98b95088fb # v0.55.1
        with:
          version: v0.55.1
      - run: cargo test --locked -p drift --test suite -- --ignored

  # The Go that remains until phase 4 of plan 2610050706: the
  # `cairn version` stub and its import-closure test (SEC-01).
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token Codecov exchanges for an upload grant, below.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The spike harnesses below download their own drivers; hash
          # their go.sum too, or a cache hit on cairn's go.sum leaves
          # them out and they download again on every run.
          cache-dependency-path: |
            go.sum
            plan/*/bench/go.sum
      - run: go build ./...
      - run: go vet ./...
      # A spike's benchmark harness is its own module, so `./...` skips
      # it and its drivers stay out of cairn's module graph. Vet and
      # test each one here, so the evidence behind a decision keeps
      # building.
      - name: Vet and test spike harnesses
        shell: bash
        run: |
          shopt -s nullglob
          for mod in plan/*/bench/go.mod; do
            (cd "$(dirname "$mod")" && go vet ./... && go test ./...)
          done
      # ENG-09: every Go test under the race detector.
      - run: go test -race ./... -coverprofile=cover.out
      # The hard floor: cmd/cairn stays at 100% of its non-excluded
      # statements (scripts/coverage-exclude.txt lists the justified
      # exceptions).
      - run: scripts/check-coverage.sh 100 ./cmd/cairn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: go-coverage
          path: cover.out
      # OIDC over a stored token: the runner mints a short-lived
      # identity that Codecov exchanges for an upload grant, so no
      # secret sits in this repository's settings. A fork PR has no
      # id-token, so the step is skipped rather than failing.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: cover.out
          flags: go
          # Only the named file, never what the uploader's search finds.
          disable_search: true
          fail_ci_if_error: false

  # NFR-10 / CON-02: the three release targets compile as static
  # binaries on every change, not first on release day.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -buildvcs=true -o /dev/null ./cmd/cairn

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # golangci-lint builds from tools/go.sum and type-checks the
          # module against go.sum; hash both or the tool's whole
          # dependency tree downloads again on every run.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # ENG-16: staticcheck, gosec, errcheck, depguard's forbidden
      # imports and the rest, from .golangci.yml.
      - run: go tool -modfile=tools/go.mod golangci-lint run

  # ENG-16: no reachable known vulnerability in the module or the
  # standard library it builds with.
  go-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod govulncheck ./...

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the mdsmith release the repository is linted with
      # locally. Bump the SHA and `version` together.
      - uses: jeduden/mdsmith@0ca0d2f7c95ab53e3e9ed8851150af98b95088fb # v0.55.1
        with:
          version: v0.55.1
          args: check .

  # Workflows are an attack surface no compiler reads. zizmor checks
  # them for an unpinned action, a token left in a checkout, an input
  # interpolated into a shell.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Pinned: the default is `latest`, which would make the job's
          # result depend on the day it ran. Dependabot bumps the
          # action's SHA but not this string, so it is a hand bump.
          version: "1.29.0"
          # Fail the job on findings instead of filing them into code
          # scanning: the check itself is the gate.
          advanced-security: false

  # The one check the branch and release-tag rulesets require. GitHub
  # names a required check after a job, never after the workflow, so
  # this job carries the name "CI" and passes only when every job above
  # passed. A job added later joins `needs:` here and the rulesets stay
  # as they are. `always()` keeps it running after a failure, so a red
  # job turns this check red instead of leaving it skipped, which a
  # ruleset would not count as a failure.
  ci:
    name: CI
    if: ${{ always() }}
    needs: [test, coverage, lint, supply-chain, drift, go, build, go-lint, go-vuln, markdown, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a CI job ended $r"; exit 1; }
          done
