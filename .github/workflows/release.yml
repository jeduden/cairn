name: Release

# Run from the Actions "Run workflow" button with a version like
# v0.1.0. A pushed tag is deliberately not the trigger: a tag is public
# the moment it exists, so a failed build would leave one pointing at
# binaries nobody can download. Here the version is validated and the
# suite run first, every binary is built twice on two independent
# builders and compared bit for bit (ENG-19), and only then does the
# publish job create the tag, sign the checksums, attest provenance and
# the SBOM (ENG-20), and publish the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0 (must start with v)"
        required: true
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

# One release at a time, and never cancelled: stopping a run between
# the tag and the upload would leave a tag with no release on it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that can say no, before anything is built. The version
  # is read through the environment rather than interpolated into the
  # shell, so a crafted input cannot inject commands.
  preflight:
    runs-on: ubuntu-latest
    if: github.repository == 'jeduden/cairn'
    steps:
      - name: Validate the version
        run: |
          if ! printf '%s' "$VERSION" |
            grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version must look like v0.1.0, got: $VERSION"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Caching is off in this workflow. A cache is writable by any
          # branch, and a release must not build from something a
          # branch could have poisoned.
          cache: false
      - run: go vet ./...
      # CI already ran this on main, but a release can be dispatched
      # from any ref. Run it again against the ref actually released.
      - run: go test -race ./...

  # Every platform built by two builders on different operating
  # systems. The same toolchain (pinned by go.mod's toolchain line),
  # the same flags and the same commit must give the same bytes; the
  # reproducible job below proves it before anything is published.
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        builder: [ubuntu-latest, macos-latest]
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    runs-on: ${{ matrix.builder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          # CON-02: one static binary, no libc, no cgo resolver.
          CGO_ENABLED: "0"
          # The toolchain comes from go.mod alone; a runner's newer Go
          # must not silently build the release.
          GOTOOLCHAIN: local
        # ENG-01: -trimpath keeps the builder's paths out of the
        # binary, -buildvcs=true embeds the commit (read it back with
        # `go version -m cairn-*`), and -buildid= drops the one
        # builder-specific field, so both builders agree byte for byte.
        run: |
          bin="cairn-${GOOS}-${GOARCH}"
          go build -trimpath -buildvcs=true \
            -ldflags="-s -w -buildid= -X main.version=${VERSION}" \
            -o "$bin" ./cmd/cairn
          echo "bin=$bin" >> "$GITHUB_ENV"
      - name: Check the binary reports the version it was stamped with
        # Only a binary for the runner's own platform can run here.
        if: >-
          (matrix.builder == 'ubuntu-latest' && matrix.target.goos == 'linux' && matrix.target.goarch == 'amd64') ||
          (matrix.builder == 'macos-latest' && matrix.target.goos == 'darwin')
        run: |
          got="$(./"$bin" version)"
          test "$got" = "$VERSION" || {
            echo "::error::binary reports $got, expected $VERSION"
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.builder }}-cairn-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: ${{ env.bin }}

  # ENG-19: the two builders' artifacts must be bit-identical. A
  # difference means the build is not reproducible, and nothing ships.
  reproducible:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ubuntu-latest-cairn-*
          path: a
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-latest-cairn-*
          path: b
          merge-multiple: true
      - name: Compare the two builders
        run: |
          (cd a && sha256sum cairn-* | sort) > a.sum
          (cd b && sha256sum cairn-* | sort) > b.sum
          cat a.sum
          diff -u a.sum b.sum || {
            echo "::error::the two builders produced different artifacts"
            exit 1
          }

  publish:
    needs: reproducible
    runs-on: ubuntu-latest
    if: github.repository == 'jeduden/cairn'
    permissions:
      # contents to create the tag and the release; id-token for the
      # keyless Sigstore signature and the attestations; attestations
      # to store them. Only this job holds any of them.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ubuntu-latest-cairn-*
          path: dist
          merge-multiple: true
      - name: Generate the SPDX SBOM
        # ENG-20: an SPDX SBOM of the Go module the binaries were built
        # from. syft is pinned, never "latest".
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/cairn.spdx.json
          syft-version: v1.52.0
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        working-directory: dist
        run: sha256sum cairn-* > checksums.txt
      - name: Attest build provenance
        # SLSA provenance, signed through Sigstore, tying each binary's
        # SHA-256 to this workflow run and commit. Verify with:
        #   gh attestation verify cairn-linux-amd64 -R jeduden/cairn
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/cairn-*-*"
      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist/cairn-*-*"
          sbom-path: dist/cairn.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"
      - name: Sign the checksum file
        # Keyless: the GitHub OIDC token binds the signature to this
        # workflow file at this ref. The bundle carries signature and
        # certificate. Verify with the command in SECURITY.md.
        working-directory: dist
        env:
          COSIGN_YES: "true"
        run: cosign sign-blob --bundle checksums.txt.sigstore.json checksums.txt
      - name: Publish the release
        # gh is already on the runner, so a third-party action holding
        # contents: write buys nothing. The tag is created here, on the
        # dispatched commit, only now that everything above succeeded.
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            cairn-* checksums.txt checksums.txt.sigstore.json
