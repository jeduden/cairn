name: Build

# The release build of the core executable (ENG-01, CON-02), defined
# once: CI runs it on every change and the release workflow runs it
# before anything is published. Every target is built once, with the
# Rust release rust-toolchain.toml pins: the Linux targets link with
# the rust-lld Rust ships, the Windows target with mingw-w64 on the
# same Linux builder, and the darwin target with the runner's own
# Apple linker. Each binary then runs once on its own platform.
on:
  workflow_call:
    inputs:
      version:
        description: "The version stamped into the executable, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  # The release targets, as rust-target:artifact-name. The Linux
  # targets are musl, which links statically (CON-02).
  LINUX_TARGETS: >-
    x86_64-unknown-linux-musl:linux-amd64
    aarch64-unknown-linux-musl:linux-arm64
    x86_64-pc-windows-gnu:windows-amd64
  DARWIN_TARGETS: >-
    aarch64-apple-darwin:darwin-arm64
  # ENG-01: mingw-w64, exact, from Ubuntu 24.04's release pocket, which
  # never changes.
  MINGW: >-
    gcc-mingw-w64-x86-64-win32=13.2.0-6ubuntu1+26.1
    binutils-mingw-w64-x86-64=2.41.90.20240122-1ubuntu1+11.4
    mingw-w64-x86-64-dev=11.0.1-3build1

jobs:
  build:
    name: build (${{ matrix.builder }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { builder: ubuntu-24.04, os: linux, runs: linux-amd64 }
          - { builder: macos-15, os: darwin, runs: darwin-arm64 }
    runs-on: ${{ matrix.builder }}
    env:
      OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick this builder's targets
        run: |
          if [ "$OS" = linux ]; then targets="$LINUX_TARGETS"; else targets="$DARWIN_TARGETS"; fi
          echo "TARGETS=$targets" >> "$GITHUB_ENV"
      - name: Install mingw-w64
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # MINGW is a list of packages
          sudo apt-get install -y -qq --no-install-recommends $MINGW
      - name: Install the pinned Rust toolchain and the targets
        run: |
          list=""
          for pair in $TARGETS; do list="$list,${pair%%:*}"; done
          rustup toolchain install \
            "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" \
            --profile minimal --no-self-update --target "${list#,}"
      - name: Build
        env:
          # ENG-01: the version and the commit, stamped into the
          # executable; `cairn version --json` reads both back.
          CAIRN_VERSION: ${{ inputs.version }}
          CAIRN_COMMIT: ${{ github.sha }}
        # ENG-01: the path prefixes keep the builder's paths out of the
        # binary. rust-lld links musl statically (CON-02).
        run: |
          base="--remap-path-prefix=$PWD=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          mkdir dist
          for pair in $TARGETS; do
            target="${pair%%:*}"
            exe=""
            case "$target" in
              *-linux-musl) extra="-Clinker=rust-lld" ;;
              *-windows-gnu) extra="-Clinker=x86_64-w64-mingw32-gcc-win32"; exe=".exe" ;;
              *) extra="" ;;
            esac
            RUSTFLAGS="$base $extra" cargo build --locked --release -p cairn --bin cairn --target "$target"
            cp "target/$target/release/cairn$exe" "dist/cairn-${pair#*:}$exe"
          done
          (cd dist && shasum -a 256 cairn-*)
      - name: Check the binary reports what it was stamped with
        env:
          BIN: dist/cairn-${{ matrix.runs }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/check-stamp.sh "$BIN" "$VERSION" "$COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.os }}-cairn
          path: dist/

  # The linux/arm64 executable is built on the x86_64 Linux builder; it
  # runs once here, on the platform it is for.
  linux-arm64:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-cairn
          path: dist
      - name: Check the binary reports what it was stamped with
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          chmod +x dist/cairn-linux-arm64
          scripts/check-stamp.sh dist/cairn-linux-arm64 "$VERSION" "$COMMIT"

  # The Windows executable is built on Linux; it runs once here, on the
  # platform it is for.
  windows:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-cairn
          path: dist
      - name: Check the binary reports what it was stamped with
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/check-stamp.sh dist/cairn-windows-amd64.exe "$VERSION" "$COMMIT"
