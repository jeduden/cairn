name: Build

# The release build of the core executable (ENG-01, ENG-19, CON-02),
# defined once: CI runs it on every change and the release workflow
# runs it before anything is published. Every target is built by two
# independent builders, set a and set b, with the Rust release
# rust-toolchain.toml pins and nothing else: the Linux targets link
# with the rust-lld Rust ships, the darwin target with the runner's own
# Apple linker. The reproducible job requires the two sets to be
# bit-identical.
on:
  workflow_call:
    inputs:
      version:
        description: "The version stamped into the executable, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  # The release targets, as rust-target:artifact-name. The Linux
  # targets are musl, which links statically (CON-02).
  LINUX_TARGETS: >-
    x86_64-unknown-linux-musl:linux-amd64
    aarch64-unknown-linux-musl:linux-arm64
  DARWIN_TARGETS: >-
    aarch64-apple-darwin:darwin-arm64

jobs:
  build:
    name: build (${{ matrix.builder }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { builder: ubuntu-latest, os: linux, set: a, runs: linux-amd64 }
          - { builder: ubuntu-24.04-arm, os: linux, set: b, runs: linux-arm64 }
          - { builder: macos-15, os: darwin, set: a, runs: darwin-arm64 }
          - { builder: macos-15-intel, os: darwin, set: b, runs: "" }
    runs-on: ${{ matrix.builder }}
    env:
      OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick this builder's targets
        run: |
          if [ "$OS" = linux ]; then targets="$LINUX_TARGETS"; else targets="$DARWIN_TARGETS"; fi
          echo "TARGETS=$targets" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain and the targets
        run: |
          list=""
          for pair in $TARGETS; do list="$list,${pair%%:*}"; done
          rustup toolchain install \
            "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" \
            --profile minimal --no-self-update --target "${list#,}"
      - name: Build
        env:
          # ENG-01: the version and the commit, stamped into the
          # executable; `cairn version --json` reads both back.
          CAIRN_VERSION: ${{ inputs.version }}
          CAIRN_COMMIT: ${{ github.sha }}
        # ENG-01 and ENG-19: the path prefixes keep the builder's paths
        # out of the binary. On Linux, rust-lld links musl statically;
        # on darwin, -Wl,-S keeps the object files' timestamps out of
        # the Mach-O UUID. Cargo.toml's release profile does the rest.
        run: |
          base="--remap-path-prefix=$PWD=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          if [ "$OS" = linux ]; then extra="-Clinker=rust-lld"; else extra="-Clink-arg=-Wl,-S"; fi
          mkdir dist
          for pair in $TARGETS; do
            target="${pair%%:*}"
            RUSTFLAGS="$base $extra" cargo build --locked --release -p cairn --bin cairn --target "$target"
            cp "target/$target/release/cairn" "dist/cairn-${pair#*:}"
          done
          (cd dist && shasum -a 256 cairn-*)
      - name: Check the binary reports what it was stamped with
        if: matrix.runs != ''
        env:
          BIN: dist/cairn-${{ matrix.runs }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/check-stamp.sh "$BIN" "$VERSION" "$COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.set }}-${{ matrix.os }}-cairn
          path: dist/

  # ENG-19: the two sets must be bit-identical. A difference means the
  # build is not reproducible, and nothing ships.
  reproducible:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: a-*-cairn
          path: a
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: b-*-cairn
          path: b
          merge-multiple: true
      - name: Compare the two builders
        run: |
          (cd a && sha256sum cairn-* | sort) > a.sum
          (cd b && sha256sum cairn-* | sort) > b.sum
          cat a.sum
          diff -u a.sum b.sum || {
            echo "::error::the two builders produced different artifacts"
            exit 1
          }
