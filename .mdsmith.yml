# mdsmith configuration for Cairn.
#
# Started from `frit init --mdsmith` (the plan/proto.md schema and the
# PLAN.md catalog it governs), extended with frit's skill kind and a
# kind for the SRS under docs/srs. Per CLAUDE.md, change this file only
# with the maintainer's explicit consent.

front-matter: true

rules:
  line-length:
    max: 80
    exclude:
      - code-blocks
      - tables
      - urls
  heading-style:
    style: atx
  heading-increment: true
  first-line-heading:
    level: 1
  no-duplicate-headings: true
  no-trailing-spaces: true
  no-hard-tabs: true
  no-multiple-blanks:
    max: 1
  single-trailing-newline: true
  fenced-code-style:
    style: backtick
  fenced-code-language: true
  no-bare-urls: true
  blank-line-around-headings: true
  blank-line-around-lists: true
  blank-line-around-fenced-code: true
  list-indent:
    spaces: 2
  table-format:
    pad: 1
  catalog:
    pad: 1
  no-trailing-punctuation-in-heading: true
  no-emphasis-as-heading: true
  cross-file-reference-integrity:
    strict: true
  # A stray Markdown file anywhere else fails the lint: docs live
  # under docs/, plans under plan/, skills under .claude/skills/.
  directory-structure:
    allowed:
      - "."
      - "docs/**"
      - "plan/**"
      - ".claude/skills/**"
  # Plan ids are the minute-precision UTC creation time, so two
  # machines can allocate one without coordinating. Uniqueness is what
  # keys a plan.
  unique-frontmatter:
    field: id
    include:
      - "plan/*.md"
      - "plan/*/plan.md"
    exclude:
      - "plan/proto.md"

kinds:
  srs:
    # The Software Requirements Specification, split one file per
    # section. Its requirement tables are normative and dense by
    # design — every row a MUST with its priority, verification method
    # and traces — and internal/srs parses them, so the readability
    # rules that would push those rows into prose step aside. Every
    # section carries a summary for the CLAUDE.md catalog.
    path-pattern: "docs/srs/*.md"
    rules:
      table-readability: false
      paragraph-readability: false
      required-frontmatter:
        fields: [summary]
  doc:
    # Every other doc carries the one-line summary the CLAUDE.md
    # catalog lists, so an agent reads the index and opens only what
    # a task touches.
    rules:
      required-frontmatter:
        fields: [summary]
  skill:
    # The plan-* skills `frit skills` writes into .claude/skills. A
    # skill loads into a working session, so every line is paid for:
    # the same caps frit applies to the skills it ships.
    path-pattern: ".claude/skills/*/SKILL.md"
    rules:
      required-frontmatter:
        fields: [name, description]
      table-readability: false
      max-file-length:
        max: 65
      token-budget:
        mode: heuristic
        max: 650
      paragraph-structure:
        max-sentences: 6
        max-words-per-sentence: 35
      max-section-length:
        per-level:
          1: 10
          2: 40
  proto:
    # proto.md leads with directives and placeholder headings rather
    # than real content; the structural rules step aside for it.
    rules:
      first-line-heading: false
      heading-increment: false
      blank-line-around-headings: false
      no-duplicate-headings: false
      no-emphasis-as-heading: false
      cross-file-reference-integrity: false
      paragraph-readability: false
      paragraph-structure: false
  plan:
    # The folder shape's `*/plan.md` is loose by design, unlike the
    # flat shape's id-prefixed name: frit's own doctor id-sync check
    # is what catches a folder not named for its id, not this pattern.
    path-pattern: "plan/{proto.md,[0-9][0-9]*_*.md,*/plan.md}"
    rules:
      required-structure:
        schema: plan/proto.md
  phase-spec:
    # A folder plan's own phase-N.md spec: the working brief `frit
    # phase` bundles for a session. Freeform prose — RED, GREEN and
    # the gate are paragraphs, the way an inline `## Phase N` section
    # already writes them, not headings — so the rules that assume a
    # heading opener step aside, and the schema only pins the
    # filename.
    path-pattern: "plan/*/phase-*.md"
    schema:
      filename: "phase-*.md"
    rules:
      first-line-heading: false
      heading-increment: false
      token-budget:
        mode: heuristic
        max: 800
  phase-record:
    # A phase's living record: parked notes while the phase stays
    # open, a `## Handoff` heading once it closes — level 2 by
    # convention, so the same structural rules step aside here too.
    # `frit phase` finds Handoff itself by walking the heading, not
    # this schema, which only pins the filename.
    path-pattern: "plan/*/phase-*.result.md"
    schema:
      filename: "phase-*.result.md"
    rules:
      first-line-heading: false
      heading-increment: false
      paragraph-readability: false
      paragraph-structure: false
      token-budget:
        mode: heuristic
        max: 900

# Order matters: proto applies first so plan/proto.md also picks up the
# plan kind, whose required-structure.schema points back at the file
# itself. That marks it as its own schema, which stops MDS020 firing on
# the <?require?> inside it.
kind-assignment:
  - glob: ["docs/**/*.md", "!docs/srs/*.md"]
    kinds: [doc]
  - glob: ["docs/srs/*.md"]
    kinds: [srs]
  - glob: [".claude/skills/*/SKILL.md"]
    kinds: [skill]
  - glob: ["**/proto.md"]
    kinds: [proto]
  - glob: ["plan/*.md", "plan/*/plan.md"]
    kinds: [plan]
  - glob: ["plan/*/phase-*.md", "!plan/*/phase-*.result.md"]
    kinds: [phase-spec]
  - glob: ["plan/*/phase-*.result.md"]
    kinds: [phase-record]

overrides:
  # A plan folder's companion files (research, fixtures, diagrams) are
  # freeform; plan.md keeps the plan kind and its full checks, and
  # phase-N.md/phase-N.result.md keep their own kinds above, so both
  # are excluded here.
  - glob: ["plan/*/*.md", "!plan/*/plan.md", "!plan/*/phase-*.md"]
    rules:
      first-line-heading: false
      heading-increment: false
      paragraph-readability: false
      paragraph-structure: false
      max-file-length: false
      cross-file-reference-integrity: false
      required-structure: false

ignore:
  - ".github/**"
